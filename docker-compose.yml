services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/felix_booster
      JWT_SECRET: local-development-secret-change-me
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_CALLBACK_URL: http://localhost:3000/api/payments/paystack/callback
      SMM_AFRICA_KEY: ${SMM_AFRICA_KEY:-}
      SMM_API_URL: https://smm.africa/api/v3
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: felix_booster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
